[package]
name = "danmaku-factory-gui"
version = "2.0.0"
edition = "2021"
description = "DanmakuFactory GUI - 弹幕转换工具图形界面 (Rust + Slint)"
license = "MIT"

[[bin]]
name = "DanmakuFactoryGUI"
path = "src/main.rs"

[dependencies]
slint = "1.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
danmakufactory-sys = { path = "../../bindings/rust" }

[build-dependencies]
slint-build = "1.17"

[profile.release]
lto = true
strip = true
